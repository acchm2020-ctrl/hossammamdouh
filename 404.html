<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Hossam Mamdouh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F5F7FA;--fg:#13263A;--muted:#55687C;--gold:#A8823F}
@media (prefers-color-scheme:dark){:root{--bg:#09141F;--fg:#E7ECF2;--muted:#9AAABB;--gold:#C6A66B;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
font-family:'Segoe UI',Tahoma,Arial,sans-serif;text-align:center;padding:24px}
p{color:var(--muted)} a{color:var(--gold);font-weight:600}
</style>
</head>
<body>
<main>
<h1>الصفحة غير موجودة</h1>
<p>Page not found</p>
<p><a href="./">العودة إلى الصفحة الرئيسية · Back to home</a></p>
</main>
<script>
/* Project sites live under /<repo>/: send visitors to that site's home page. */
(function(){var p=location.pathname.split('/').filter(Boolean);var home=(location.hostname.endsWith('github.io')&&p.length)?'/'+p[0]+'/':'/';document.querySelector('a').href=home;})();
</script>
</body>
</html>
